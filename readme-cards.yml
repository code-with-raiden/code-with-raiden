name: Update profile README cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contributions
        env:
          GH_USER: code-with-raiden
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repos, graph)
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
